name: Release Builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version/tag name for this release (e.g. v0.02a). Only used for a manual run; ignored on a tag push.'
        required: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/build.gradle', 'android/settings.gradle', 'android/app/build.gradle', 'pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - run: flutter pub get
      - run: flutter build apk --release --no-pub
      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk hamcore-${{ env.RELEASE_TAG }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: hamcore-${{ env.RELEASE_TAG }}.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - run: flutter pub get
      # No Apple Developer signing secrets are configured, so this is an
      # unsigned build. It won't install on a device as-is; it needs to be
      # re-signed locally with a valid provisioning profile (Xcode), or
      # installed via a sideloading tool. See TESTFLIGHT_GUIDE.md for the
      # manual, signed release process.
      - run: flutter build ios --release --no-codesign --no-pub
      - name: Zip unsigned app
        run: |
          cd build/ios/iphoneos
          zip -r "../../../hamcore-${{ env.RELEASE_TAG }}-ios-unsigned.zip" Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: hamcore-${{ env.RELEASE_TAG }}-ios-unsigned.zip

  release:
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ env.RELEASE_TAG }}" \
            android-apk/*.apk \
            ios-unsigned/*.zip \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "HamCore ${{ env.RELEASE_TAG }}" \
            --generate-notes
